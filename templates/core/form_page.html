{% extends "base.html" %}

{% block title %}{{ title }} | Hospital Registration{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save</button>
    </form>
</div>
{% endblock %}
