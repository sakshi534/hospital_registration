<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Hospital Registration{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <h1><a href="{% url 'home' %}">Hospital Registration</a></h1>
            <div class="topbar-actions">
                {% if user.is_authenticated %}
                    <a class="btn btn-small btn-light" href="{% url 'dashboard' %}">Go to Dashboard</a>
                    <a class="btn btn-small" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="btn btn-small btn-light" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-small" href="{% url 'signup' %}">Register Staff</a>
                {% endif %}
            </div>
        </div>
    </header>

    <nav class="nav">
        <div class="container nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'services' %}">Services</a>
            <a href="{% url 'members' %}">Members</a>
            <a href="{% url 'contact' %}">Contact</a>
        </div>
    </nav>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
