{% extends "base.html" %}

{% block title %}Sign Up | Hospital Registration{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Create Account</h2>
    <p class="muted">Register as Receptionist or Doctor.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="muted" style="margin-top: 12px;">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
</div>
{% endblock %}
