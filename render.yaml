services:
  - type: web
    name: hospital-registration-web
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn hospital_site.wsgi:application
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hospital-registration-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hospital-registration-web.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-registration-db
          property: connectionString

databases:
  - name: hospital-registration-db
    plan: starter
